<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Próximos Eventos | HeForShe</title>
<link rel="icon" href="img/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;0,900;1,400;1,500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HeForShe · sistema de diseño
   Paleta: rosa magenta + violeta (fiel a la marca original)
   Tipografía: Fraunces (display) + Inter (texto) + Space Grotesk (etiquetas)
   Firma visual: anillos entrelazados (unión He + She)
============================================================ */

:root{
  --ink:#141414;
  --ink-soft:#59535c;
  --paper:#fffbfc;
  --surface:#ffffff;
  --blush:#ffe4ef;
  --blush-2:#ffc9de;
  --magenta:#ff2d76;
  --magenta-deep:#c40a55;
  --rose:#ff6fa0;
  --violet:#141414;
  --violet-deep:#0d0d0d;
  --orchid:#050505;
  --orchid-light:#ff4f93;
  --line: rgba(12,12,12,0.1);
  --shadow-soft: 0 24px 55px rgba(12,12,12,0.13);
  --shadow-tight: 0 8px 20px rgba(12,12,12,0.09);
  --radius-lg: 30px;
  --radius-md: 20px;
  --radius-sm: 12px;
  --font-display:'Fraunces', serif;
  --font-body:'Inter', sans-serif;
  --font-label:'Space Grotesk', sans-serif;
}

*{ margin:0; padding:0; box-sizing:border-box; }

html{ scroll-behavior:smooth; }

body{
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
  line-height:1.65;
  -webkit-font-smoothing: antialiased;
}

h1,h2,h3{ font-family: var(--font-display); color: var(--violet-deep); }

a{ color:inherit; }

img{ display:block; max-width:100%; }

:focus-visible{
  outline: 3px solid var(--orchid-light);
  outline-offset: 3px;
}

.eyebrow{
  font-family: var(--font-label);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--magenta-deep);
}

/* ================= RING MARK (firma visual) ================= */
.ring-mark{ display:inline-block; line-height:0; }
.ring-mark svg{ display:block; }

/* ================= HEADER / NAV ================= */
header{
  position: sticky;
  top:0;
  z-index: 50;
  background: rgba(255,249,251,0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding: 0.9rem 2rem;
  max-width: 1240px;
  margin: 0 auto;
  position: relative;
}

.logo-container{
  display:flex;
  align-items:center;
  gap:0.7rem;
  text-decoration:none;
  color:inherit;
}

.logo-img{
  width: 44px;
  height:44px;
  object-fit:cover;
  border-radius: 50%;
  border: 2px solid var(--blush-2);
}

.logo-text{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.35rem;
  color: var(--violet-deep);
  letter-spacing: 0.5px;
}

.nav-toggle{
  display:none;
  background:none;
  border:none;
  cursor:pointer;
  width: 40px;
  height:40px;
  position:relative;
  z-index: 60;
}
.nav-toggle span{
  position:absolute;
  left:8px;
  right:8px;
  height:2px;
  background: var(--violet-deep);
  border-radius:2px;
  transition: transform .3s ease, opacity .3s ease, top .3s ease;
}
.nav-toggle span:nth-child(1){ top:13px; }
.nav-toggle span:nth-child(2){ top:19px; }
.nav-toggle span:nth-child(3){ top:25px; }
.nav-toggle.open span:nth-child(1){ top:19px; transform: rotate(45deg); }
.nav-toggle.open span:nth-child(2){ opacity:0; }
.nav-toggle.open span:nth-child(3){ top:19px; transform: rotate(-45deg); }

.nav-links{
  display:flex;
  list-style:none;
  gap: 2.2rem;
  font-family: var(--font-label);
}

.nav-links a{
  text-decoration:none;
  color: var(--ink);
  font-weight: 600;
  font-size: 0.92rem;
  letter-spacing: 0.3px;
  position: relative;
  padding-bottom: 4px;
  transition: color 0.3s ease;
}

.nav-links a::after{
  content:"";
  position:absolute;
  left:0; bottom:0;
  width:0%;
  height:2px;
  background: linear-gradient(90deg, var(--magenta), var(--orchid-light));
  transition: width 0.3s ease;
}

.nav-links a:hover{ color: var(--magenta-deep); }
.nav-links a:hover::after{ width:100%; }

/* ================= BOTONES ================= */
.cta-button, .instagram-btn, .evento-btn, .info-btn{
  font-family: var(--font-label);
  font-weight: 700;
  letter-spacing: 0.3px;
  border:none;
  cursor:pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.3s ease;
}

.cta-button{
  background: linear-gradient(135deg, var(--magenta), var(--rose));
  color:#fff;
  padding: 0.95rem 2.2rem;
  border-radius: 999px;
  font-size: 0.95rem;
  box-shadow: 0 14px 30px rgba(226,60,142,0.4);
}
.cta-button:hover{ transform: translateY(-3px); box-shadow: 0 18px 36px rgba(226,60,142,0.5); }

/* ================= HERO ================= */
#hero{
  position: relative;
  overflow:hidden;
  min-height: 92vh;
  display:flex;
  align-items:center;
  background: radial-gradient(circle at 15% 20%, #262626 0%, var(--violet-deep) 45%, #000000 100%);
  color:#fff;
}

.hero-rings{
  position:absolute;
  right: -6%;
  top: 50%;
  transform: translateY(-50%);
  width: min(52vw, 620px);
  opacity: 0.9;
  pointer-events:none;
}

.hero-grain{
  position:absolute;
  inset:0;
  background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size: 3px 3px;
  mix-blend-mode: overlay;
  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width: 1240px;
  margin: 0 auto;
  padding: 4rem 2rem;
  width:100%;
}

.hero-inner{
  max-width: 640px;
  animation: fadeInUp 1s ease;
}

.hero-eyebrow{
  font-family: var(--font-label);
  font-size: 0.8rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #ffc2dc;
  margin-bottom: 1.2rem;
  display:block;
}

#hero h1{
  font-family: var(--font-display);
  color:#fff;
  font-size: clamp(2.2rem, 4.4vw, 3.4rem);
  font-weight: 700;
  line-height:1.15;
  margin-bottom: 1.3rem;
}

#hero h1 em{
  font-style: italic;
  font-weight: 400;
  color: #ff8fbd;
}

#hero p{
  font-size: 1.15rem;
  color: #ffe4ef;
  margin-bottom: 2.2rem;
  max-width: 480px;
}

@keyframes fadeInUp{
  0%{ opacity:0; transform: translateY(24px); }
  100%{ opacity:1; transform: translateY(0); }
}

/* ================= VIDEO ================= */
#video-section{
  padding: 0 1rem 4rem;
  display:none;
  background: var(--violet-deep);
}
.video-container{
  position:relative;
  padding-top:56.25%;
  max-width: 900px;
  margin:0 auto;
}
.video-container iframe{
  position:absolute; inset:0; width:100%; height:100%; border-radius:20px;
  box-shadow: var(--shadow-soft);
}

/* ================= NOSOTROS ================= */
#Nosotros{
  padding: 6rem 2rem;
  max-width: 1240px;
  margin: 0 auto;
}

.section-head{
  text-align:center;
  max-width: 640px;
  margin: 0 auto 3.2rem;
}

.section-head .eyebrow{ display:block; margin-bottom:0.6rem; }

#Nosotros h2, #PoderosasMX h2, #InspiracionMX h2{
  font-size: clamp(1.9rem, 3vw, 2.6rem);
  letter-spacing: 0.3px;
}

.Nosotros-grid{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2rem;
}

.Nosotros-card{
  background: var(--surface);
  border-radius: var(--radius-lg);
  overflow:hidden;
  box-shadow: var(--shadow-tight);
  border: 1px solid var(--line);
  transition: transform 0.35s ease, box-shadow 0.35s ease;
  display:flex;
  flex-direction:column;
}

.Nosotros-card:hover{
  transform: translateY(-6px);
  box-shadow: var(--shadow-soft);
}

.card-media{ position:relative; aspect-ratio: 16/10; overflow:hidden; }
.card-media img{ width:100%; height:100%; object-fit:cover; transition: transform 0.5s ease; }
.Nosotros-card:hover .card-media img{ transform: scale(1.06); }

.card-tag{
  position:absolute;
  top: 14px; left:14px;
  font-family: var(--font-label);
  font-size: 0.68rem;
  font-weight:700;
  letter-spacing: 1.5px;
  text-transform:uppercase;
  color: var(--violet-deep);
  background: rgba(255,255,255,0.92);
  padding: 0.4rem 0.85rem;
  border-radius: 999px;
}

.card-body{ padding: 1.6rem 1.8rem 1.9rem; }

#Nosotros h3{ font-size: 1.35rem; margin-bottom: 0.4rem; }

.descripcion{ color: var(--ink-soft); margin-bottom: 1.1rem; font-size: 0.98rem; }

.info-btn{
  background: transparent;
  color: var(--magenta-deep);
  border: 2px solid var(--blush-2);
  padding: 0.6rem 1.3rem;
  border-radius: 999px;
  font-size: 0.85rem;
}
.info-btn:hover{ background: var(--blush); border-color: var(--magenta); transform: translateY(-2px); }

.info-text{
  max-height:0;
  overflow:hidden;
  opacity:0;
  transition: max-height 0.6s ease, opacity 0.5s ease, margin 0.5s ease;
  border-left: 3px solid var(--blush-2);
  margin-top:0;
  padding-left: 0;
}
.info-text.active{
  max-height: 2400px;
  opacity:1;
  margin-top: 1.4rem;
  padding-left: 1.1rem;
}
.info-text h4{ color: var(--orchid); font-family: var(--font-label); font-size: 0.95rem; letter-spacing:0.3px; margin-top:1.1rem; }
.info-text h4:first-child{ margin-top:0; }
.info-text p{ margin-top:0.5rem; color: var(--ink-soft); font-size: 0.95rem; }
.info-text ul{ padding-left:1.2rem; margin-top:0.5rem; color: var(--ink-soft); font-size:0.95rem; }
.info-text ul li{ margin-bottom:0.35rem; }

/* ================= PODEROSAS MX (carrusel) ================= */
#PoderosasMX{
  padding: 6rem 2rem;
  max-width: 1240px;
  margin:0 auto;
  text-align:center;
  position:relative;
}

.carrusel-container{
  position:relative;
  max-width: 780px;
  margin: 0 auto;
  border-radius: var(--radius-lg);
  overflow:hidden;
  background: linear-gradient(135deg, var(--violet-deep), var(--orchid) 120%);
  box-shadow: var(--shadow-soft);
  padding: 0.4rem;
}

.carrusel-slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition: opacity 0.8s ease;
  padding: 3rem 2.5rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
}

.carrusel-slide.active{ opacity:1; position:relative; }

.carrusel-slide img{
  width: 150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
  border: 4px solid rgba(255,255,255,0.7);
  margin-bottom: 1.3rem;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.carrusel-slide h3{ color:#fff; font-size:1.4rem; margin-bottom:0.5rem; }
.carrusel-slide p{ color:#ffd6e6; font-size:1rem; max-width:460px; }
.carrusel-slide p:empty{ display:none; }

.carrusel-container .prev,
.carrusel-container .next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background: rgba(255,255,255,0.16);
  border: 1px solid rgba(255,255,255,0.4);
  color:#fff;
  width:44px; height:44px;
  border-radius:50%;
  font-size:1.2rem;
  cursor:pointer;
  z-index:5;
  transition: background 0.3s ease;
}
.carrusel-container .prev:hover, .carrusel-container .next:hover{ background: rgba(255,255,255,0.32); }
.carrusel-container .prev{ left:14px; }
.carrusel-container .next{ right:14px; }

/* ================= INSPIRACIÓN ================= */
#InspiracionMX{
  padding: 6rem 2rem;
  max-width:1240px;
  margin:0 auto;
  text-align:center;
}

.inspiracion-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap: 1.8rem;
  margin-top: 3rem;
}

.inspiracion-card{
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: 2rem 1.6rem 1.6rem;
  position:relative;
  text-align:left;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-tight);
  transition: transform 0.35s ease, box-shadow 0.35s ease;
}
.inspiracion-card:hover{ transform: translateY(-6px); box-shadow: var(--shadow-soft); }

.inspiracion-card::before{
  content:"\201C";
  position:absolute;
  top: 0.6rem; right:1.2rem;
  font-family: var(--font-display);
  font-size: 4rem;
  color: var(--blush-2);
  line-height:1;
  z-index:0;
}

.inspiracion-card img{
  width:56px; height:56px;
  border-radius:50%;
  object-fit:cover;
  border: 2px solid var(--orchid-light);
  margin-bottom: 1rem;
  position:relative;
  z-index:1;
}

.inspiracion-card h3{ font-size:1.05rem; margin-bottom:0.5rem; position:relative; z-index:1; }
.inspiracion-card p{
  color: var(--ink-soft);
  font-style: italic;
  font-size: 0.95rem;
  position:relative; z-index:1;
}

/* ================= INSTAGRAM ================= */
#Instagram{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding: 4.5rem 2rem;
  max-width: 820px;
  margin: 2rem auto 5rem;
  text-align:center;
  background: linear-gradient(135deg, var(--blush) 0%, #fff 70%);
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-tight);
}

#Instagram p{
  font-family: var(--font-display);
  font-size: 1.7rem;
  font-weight:600;
  color: var(--magenta-deep);
  margin-bottom: 2rem;
}

.instagram-btn{
  padding: 1rem 2.6rem;
  font-size: 1rem;
  background: linear-gradient(135deg, var(--magenta), var(--orchid));
  color:#fff;
  border-radius: 999px;
  box-shadow: 0 14px 30px rgba(151,0,221,0.35);
}
.instagram-btn:hover{ transform: translateY(-3px) scale(1.03); box-shadow: 0 18px 36px rgba(151,0,221,0.45); }

/* ================= FOOTER ================= */
footer{
  background: linear-gradient(135deg, var(--violet-deep), var(--orchid));
  color:#fff;
  text-align:center;
  padding: 2.6rem 2rem;
  font-family: var(--font-label);
}
footer p:first-child{ font-size:1.05rem; font-weight:600; margin-bottom:0.3rem; }
footer p:last-child{ opacity:0.85; font-size:0.9rem; }

/* ================= RESPONSIVE ================= */
@media (max-width: 900px){
  .Nosotros-grid{ grid-template-columns: 1fr; }
}

@media (max-width: 768px){
  .nav-toggle{ display:block; }
  .nav-links{
    position:absolute;
    top: 100%;
    left:0; right:0;
    background: var(--paper);
    flex-direction:column;
    align-items:flex-start;
    gap: 0;
    max-height:0;
    overflow:hidden;
    transition: max-height 0.4s ease;
    border-bottom: 1px solid var(--line);
  }
  .nav-links.open{ max-height: 320px; }
  .nav-links li{ width:100%; }
  .nav-links a{ display:block; padding: 0.9rem 2rem; width:100%; }
  .nav-links a::after{ display:none; }

  .hero-rings{ opacity:0.35; width: 80vw; right:-20%; }
  #hero{ min-height: auto; padding: 2rem 0 3rem; }
  .carrusel-slide{ padding: 2.4rem 1.4rem; }
}

@media (max-width:480px){
  #hero h1{ font-size:1.9rem; }
}
/* ================= EVENTOS — página (rediseño minimalista) ================= */
#Eventos{
  padding: 6rem 1.5rem 7rem;
  max-width: 760px;
  margin: 0 auto;
}

.eventos-head{
  margin-bottom: 4.5rem;
}
.eventos-head .eyebrow{ display:block; margin-bottom:0.7rem; }
#Eventos h2{ font-size: clamp(2rem, 3.4vw, 2.9rem); letter-spacing:-0.5px; }

.eventos-lista{
  display:flex;
  flex-direction:column;
}
.eventos-cargando{ color: var(--ink-soft); font-size:0.95rem; padding: 1rem 0; }

.evento-card{
  display:flex;
  align-items:flex-start;
  gap: 2.4rem;
  width:100%;
  padding: 3rem 0;
  border-radius:0;
  overflow:visible;
  background: transparent;
  border:none;
  border-bottom: 1px solid var(--line);
  position:relative;
  transition: opacity 0.4s ease, filter 0.4s ease;
}
.eventos-lista .evento-card:first-child{ padding-top:0; }

/* imagen grande y cuadrada, la protagonista de la tarjeta */
.evento-visual{
  position:relative;
  flex-shrink:0;
  width: 176px;
  height: 176px;
}

.evento-thumb{
  width:100%; height:100%;
  border-radius: 18px;
  overflow:hidden;
  box-shadow: var(--shadow-soft);
  filter: grayscale(12%);
  transition: filter 0.4s ease, transform 0.4s ease;
}
.evento-card:hover .evento-thumb{ filter:grayscale(0%); transform: scale(1.02); }
.evento-thumb img{ width:100%; height:100%; object-fit:cover; }

/* sello de fecha, como una estampa pegada sobre la esquina de la foto */
.evento-stamp{
  position:absolute;
  top:-14px; left:-14px;
  z-index:2;
  width: 66px;
  padding: 0.7rem 0.2rem 0.6rem;
  background: linear-gradient(155deg, var(--magenta) 0%, var(--rose) 100%);
  border-radius: 10px;
  color:#fff;
  text-align:center;
  transform: rotate(-8deg);
  box-shadow: 0 10px 20px rgba(226,45,118,0.38);
  transition: transform 0.45s cubic-bezier(.22,.85,.32,1.2);
}
.evento-card:hover .evento-stamp{ transform: rotate(-2deg) translateY(-2px); }
.evento-stamp::before{
  content:"";
  position:absolute; inset:4px;
  border: 1.5px dashed rgba(255,255,255,0.5);
  border-radius:6px;
  pointer-events:none;
}
.evento-stamp .mes{ display:block; font-family: var(--font-label); font-size:0.55rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; opacity:0.85; }
.evento-stamp .dia{ display:block; font-family: var(--font-display); font-size:1.6rem; font-weight:700; line-height:1; margin:0.1rem 0; }
.evento-stamp .dow{ display:block; font-family: var(--font-label); font-size:0.5rem; letter-spacing:1px; text-transform:uppercase; opacity:0.85; }

.evento-contenido{ flex:1; min-width:0; padding-top:0.15rem; }

.evento-tag{
  display:inline-block;
  font-family: var(--font-label);
  font-size:0.68rem;
  font-weight:700;
  color: var(--magenta-deep);
  background: var(--blush);
  padding: 0.28rem 0.85rem;
  border-radius:999px;
  margin-bottom:0.7rem;
}

.evento-contenido h3{ font-size:1.5rem; margin-bottom:0.9rem; letter-spacing:-0.3px; }

.evento-meta{
  display:flex;
  flex-wrap:wrap;
  row-gap:0.35rem;
  column-gap:1.3rem;
  font-size:0.92rem;
  color: var(--ink-soft);
  margin-bottom:1.2rem;
}
.evento-meta span{ display:inline-flex; align-items:center; gap:0.4rem; }

.evento-btn{
  background:none;
  color: var(--ink);
  border:none;
  padding:0;
  font-size:0.82rem;
  font-weight:700;
  cursor:pointer;
  text-decoration: underline;
  text-underline-offset: 5px;
  text-decoration-color: var(--blush-2);
  text-decoration-thickness: 1.5px;
}
.evento-btn:hover{ color: var(--magenta-deep); text-decoration-color: var(--magenta); }

.evento-info{
  max-height:0;
  overflow:hidden;
  opacity:0;
  margin-top: 0;
  transition: max-height 0.6s ease, opacity 0.5s ease, margin 0.5s ease;
}
.evento-info.active{ max-height:600px; opacity:1; margin-top:1.1rem; }
.evento-info p{ font-size:0.95rem; color: var(--ink-soft); line-height:1.65; max-width:56ch; }

/* archivados */
.evento-card.archivado{
  opacity:0.5;
  filter: grayscale(100%);
}
.evento-card.archivado::after{
  content:"Finalizado";
  position:absolute;
  top:3rem; right:0;
  font-family: var(--font-label);
  background: var(--ink);
  color:#fff;
  font-size:0.6rem;
  font-weight:700;
  letter-spacing:1.2px;
  padding: 0.32rem 0.75rem;
  border-radius:999px;
  z-index:2;
}
.evento-card.archivado:hover{ opacity:0.65; }
.evento-card.archivado .evento-btn{ display:none; }

/* coming soon */
.eventos-soon-container{ display:flex; justify-content:center; margin-top: 4.5rem; }

.coming-soon-card{
  background: transparent;
  padding: 2.6rem 1.5rem;
  border-radius: 6px;
  border: 1px dashed var(--blush-2);
  max-width: 420px;
  width:100%;
  text-align:center;
  opacity:0;
  transform: translateY(20px);
  transition: opacity 1s ease, transform 0.8s ease;
}
.coming-soon-card.show{ opacity:1; transform:translateY(0); }
.coming-soon-card img{ width:100%; max-height:180px; object-fit:cover; border-radius:6px; margin-bottom:1.3rem; opacity:0.85; filter:grayscale(30%); }
.coming-soon-card h3{ font-size:1.1rem; color: var(--ink-soft); font-family: var(--font-label); letter-spacing:2px; font-weight:600; }

/* toggle pasados */
.toggle-archivados{
  display:flex;
  align-items:center;
  gap:0.6rem;
  cursor:pointer;
  font-family: var(--font-label);
  font-weight:700;
  margin: 4.5rem 0 1.5rem;
  color: var(--ink);
  user-select:none;
  font-size:0.85rem;
  letter-spacing:0.5px;
  text-transform:uppercase;
  transition: color 0.25s ease;
}
.toggle-archivados:hover{ color: var(--magenta-deep); }
.toggle-archivados .flecha{ transition: transform 0.35s ease; font-size:1rem; color: var(--magenta); }
.toggle-archivados.abierto .flecha{ transform: rotate(90deg); }

.eventos-pasados{ overflow:hidden; transition: max-height 0.6s ease, opacity 0.4s ease; }
.eventos-pasados.oculto{ max-height:0; opacity:0; }
.eventos-pasados.activo{ max-height:3000px; opacity:1; }
.eventos-pasados h2{ font-size:0.8rem; font-family: var(--font-label); letter-spacing:2px; text-transform:uppercase; color: var(--ink-soft); margin-bottom:1.8rem; }
.eventos-pasados-lista{ display:flex; flex-direction:column; }

@media (max-width: 620px){
  .evento-card{ flex-direction:column; gap:1.2rem; padding: 2.4rem 0; }
  .evento-visual{ width:140px; height:140px; }
  .evento-stamp{ width:58px; top:-10px; left:-10px; }
  .evento-card.archivado::after{ position:static; display:inline-block; margin-top:0.6rem; }
}

</style>
</head>
<body>

<header>
  <nav>
    <a href="./" class="logo-container">
      <img src="img/heforshe-logo-united-nations-headquarters-gender-equality-un-women-emma-watson.jpg" alt="Logo HeForShe" class="logo-img">
      <span class="logo-text">HeForShe</span>
    </a>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button>
    <ul class="nav-links">
      <li><a href="./">Inicio</a></li>
      <li><a href="./#Nosotros">Sobre nosotros</a></li>
      <li><a href="./#Instagram">Instagram</a></li>
      <li><a href="eventos.html">Eventos</a></li>
    </ul>
  </nav>
</header>

<section id="Eventos">
  <div class="eventos-head">
    <span class="eyebrow">Agenda estudiantil</span>
    <h2>Próximos Eventos</h2>
  </div>

  <div class="eventos-lista" id="eventos-lista">
    <p class="eventos-cargando">Cargando eventos...</p>
  </div>

  <!-- COMING SOON: solo se muestra cuando NO hay eventos próximos -->
  <div class="eventos-soon-container" id="eventos-soon-container" style="display:none;">
    <div class="coming-soon-card">
      <img src="img/Proximamente.png" alt="Eventos próximamente">
      <h3>COMING SOON...</h3>
    </div>
  </div>

  <!-- TOGGLE -->
  <div class="toggle-archivados" onclick="toggleArchivados()">
    <span class="flecha">▸</span>
    <span class="texto">Eventos pasados</span>
  </div>

  <!-- EVENTOS PASADOS -->
  <section id="eventos-pasados" class="eventos-pasados oculto">
    <h2>Eventos pasados</h2>
    <div class="eventos-pasados-lista">
      <!-- aquí se insertan los evento-card archivados -->
    </div>
  </section>

</section>

<footer>
  <p>Gracias por tu interés. 🤍</p>
  <p>Síguenos en nuestras redes y participa en los eventos</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

function construirTarjeta(ev) {
  const [y, m, d] = ev.fecha.split('-').map(Number);
  const fechaObj = new Date(y, m - 1, d);
  const thumbSrc = ev.mediaTipo === 'video' ? (ev.posterUrl || ev.mediaUrl || '') : (ev.mediaUrl || '');

  const metaExtra = ev.metaExtra ? `<span>${ev.metaExtra}</span>` : '';
  const hora = ev.hora ? `<span>⏰ ${ev.hora}</span>` : '';
  const ubicacion = ev.ubicacion ? `<span>📍 ${ev.ubicacion}</span>` : '';

  const card = document.createElement('div');
  card.className = 'evento-card';
  card.dataset.fecha = ev.fecha;
  card.innerHTML = `
    <div class="evento-visual">
      <div class="evento-thumb">
        <img src="${thumbSrc}" alt="${ev.titulo}">
      </div>
      <div class="evento-stamp">
        <span class="mes">${MESES[fechaObj.getMonth()]}</span>
        <span class="dia">${fechaObj.getDate()}</span>
        <span class="dow">${DIAS[fechaObj.getDay()]}</span>
      </div>
    </div>
    <div class="evento-contenido">
      <span class="evento-tag">${ev.tag || ''}</span>
      <h3>${ev.titulo}</h3>
      <div class="evento-meta">${hora}${ubicacion}${metaExtra}</div>
      <button class="evento-btn toggle-btn">Ver más información</button>
      <div class="evento-info">
        <p>${ev.descripcion || ''}</p>
      </div>
    </div>
  `;
  return card;
}

function activarToggles(contenedor) {
  contenedor.querySelectorAll('.toggle-btn').forEach(boton => {
    boton.addEventListener('click', () => {
      const info = boton.nextElementSibling;
      info.classList.toggle('active');
      boton.textContent = info.classList.contains('active')
        ? 'Ver menos información'
        : 'Ver más información';
    });
  });
}

function cargarEventosPublicos() {
  const listaEl = document.getElementById('eventos-lista');
  const pasadosEl = document.querySelector('#eventos-pasados .eventos-pasados-lista');
  const soonContainer = document.getElementById('eventos-soon-container');
  const comingSoon = document.querySelector('.coming-soon-card');

  db.collection('eventos').orderBy('fecha', 'asc').get().then(snap => {
    listaEl.innerHTML = '';
    pasadosEl.innerHTML = '';

    if (snap.empty) {
      listaEl.innerHTML = '<p class="eventos-cargando">Aún no hay eventos publicados. ¡Vuelve pronto!</p>';
      mostrarComingSoon(true);
      return;
    }

    const hoyStr = new Date().toISOString().slice(0, 10);
    const proximos = [];
    const pasados = [];

    snap.forEach(doc => {
      const ev = doc.data();
      if (ev.fecha < hoyStr) pasados.push(ev);
      else proximos.push(ev);
    });

    if (proximos.length === 0) {
      listaEl.innerHTML = '<p class="eventos-cargando">No hay eventos próximos por el momento.</p>';
      mostrarComingSoon(true);
    } else {
      proximos.forEach(ev => listaEl.appendChild(construirTarjeta(ev)));
      mostrarComingSoon(false);
    }

    // los pasados se muestran del más reciente al más antiguo
    pasados.reverse().forEach(ev => {
      const card = construirTarjeta(ev);
      card.classList.add('archivado');
      pasadosEl.appendChild(card);
    });

    activarToggles(listaEl);
    activarToggles(pasadosEl);
  }).catch(err => {
    console.error(err);
    listaEl.innerHTML = '<p class="eventos-cargando">No se pudieron cargar los eventos. Intenta más tarde.</p>';
    mostrarComingSoon(true);
  });

  function mostrarComingSoon(mostrar) {
    if (!soonContainer) return;
    soonContainer.style.display = mostrar ? 'flex' : 'none';
    if (mostrar && comingSoon) {
      comingSoon.classList.remove('show');
      setTimeout(() => comingSoon.classList.add('show'), 50);
    }
  }
}

document.addEventListener("DOMContentLoaded", () => {
  cargarEventosPublicos();
});

function toggleArchivados() {
  const contenedor = document.getElementById("eventos-pasados");
  const toggle = document.querySelector(".toggle-archivados");

  contenedor.classList.toggle("activo");
  contenedor.classList.toggle("oculto");
  toggle.classList.toggle("abierto");
}

const navToggle = document.querySelector('.nav-toggle');
const navLinks = document.querySelector('.nav-links');
navToggle.addEventListener('click', () => {
  const isOpen = navLinks.classList.toggle('open');
  navToggle.classList.toggle('open');
  navToggle.setAttribute('aria-expanded', isOpen);
});
navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
  navLinks.classList.remove('open');
  navToggle.classList.remove('open');
}));
</script>

</body>
</html>
